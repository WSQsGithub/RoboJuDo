headless: true
num_envs: 256
train_mode: null
auto_load_latest: true
checkpoint: null
project_name: VM_PnPBox_Student
experiment_name: DofPos_Student_wo_table
base_dir: logs
timestamp: ${now:%Y%m%d_%H%M%S}
experiment_dir: ${base_dir}/${project_name}/${timestamp}-${experiment_name}-${log_task_name}-${robot.asset.robot_type}
save_dir: ${experiment_dir}/.hydra
force_flat_terrain: false
use_wandb: false
log_task_name: ${simulator.config.name}
sim_type: isaacgym
sim_device: cuda:3
env_spacing: 20
output_dir: ${experiment_dir}/output
eval_overrides:
  headless: false
  num_envs: 1
  auto_load_latest: false
  use_wandb: false
  env:
    config:
      max_episode_length_s: 100000
algo:
  _target_: humanoidverse.agents.rsl_rl_wrapper.rsl_rl_adaptor.RSLRLAdaptor
  _recursive_: false
  config:
    eval_callbacks: null
    runner:
      class_name: OnPolicyRunner
      num_steps_per_env: 60
      max_iterations: 20000
      init_at_random_ep_len: true
      load_optimizer: true
      seed: 1
      use_entropy_coef_curriculum: false
      entropy_coef_start: 0.01
      entropy_coef_end: 0.001
      ent_coef_curriculum_start_step: 60000
      ent_coef_curriculum_common_step: 180000
      obs_groups:
        policy:
        - actor_obs
        - actor_obs_2d
        critic:
        - critic_obs
        teacher:
        - teacher_obs
      save_interval: 100
      experiment_name: ${experiment_name}
      run_name: ${experiment_name}_${seed}
      logger: tensorboard
      neptune_project: ${project_name}
      wandb_project: ${project_name}
      policy:
        class_name: ActorCriticCNN
        activation: elu
        actor_obs_normalization: true
        critic_obs_normalization: true
        actor_hidden_dims:
        - 512
        - 256
        - 128
        critic_hidden_dims:
        - 768
        - 256
        - 128
        init_noise_std: 1.0
        noise_std_type: scalar
        state_dependent_std: false
        actor_cnn_cfg:
          output_channels:
          - 16
          - 32
          - 64
          kernel_size:
          - 5
          - 3
          - 3
          stride:
          - 2
          - 2
          - 2
          dilation:
          - 1
          - 1
          - 1
          padding:
          - 0
          - 0
          - 0
          norm: none
          activation: elu
          max_pool:
          - false
          - false
          - false
          global_pool: none
          flatten: true
      teacher:
        class_name: Actor
        model_path: logs/VM_PnPBox/20260511_192155-DofPos_Teacher-isaacgym-g1_23dof_no_hand/model_21000.pt
        activation: elu
        actor_obs_normalization: true
        actor_hidden_dims:
        - 512
        - 256
        - 128
        init_noise_std: 0.0
        noise_std_type: scalar
        state_dependent_std: false
      algorithm:
        class_name: DAggerPPO
        dag_loss_coef: 0.1
        learning_rate: 0.001
        num_learning_epochs: 5
        num_mini_batches: 4
        schedule: adaptive
        value_loss_coef: 1.0
        clip_param: 0.2
        use_clipped_value_loss: true
        desired_kl: 0.01
        entropy_coef: 0.01
        gamma: 0.99
        lam: 0.95
        max_grad_norm: 1.0
        normalize_advantage_per_mini_batch: false
env:
  _target_: humanoidverse.envs.visualmimic.pnp_env.PnPTaskEnv
  _recursive_: false
  config:
    experiment_name: ${experiment_name}
    num_envs: ${num_envs}
    headless: ${headless}
    simulator: ${simulator}
    save_rendering_dir: null
    ckpt_dir: null
    robot: ${robot}
    domain_rand: ${domain_rand}
    rewards: ${rewards}
    terrain: ${terrain}
    obs: ${obs}
    env_spacing: 5.0
    max_episode_length_s: 24
    normalization:
      clip_actions: 80.0
      clip_observations: 80.0
    termination:
      terminate_when_close_to_dof_pos_limit: false
      terminate_when_close_to_dof_vel_limit: false
      terminate_when_close_to_torque_limit: false
      terminate_by_contact: false
      terminate_by_gravity: false
      terminate_by_low_height: false
      terminate_by_com: true
      terminate_by_out_of_sight: true
      terminate_when_object_flipped: true
